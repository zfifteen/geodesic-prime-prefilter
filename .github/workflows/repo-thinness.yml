name: repo-thinness

on:
  push:
  pull_request:

jobs:
  stay-thin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stay-thin gate
        run: python3 scripts/check_repo_thinness.py
      - name: Unit tests for thinness gate
        run: python3 -m pytest tests/python/test_repo_thinness.py -q
