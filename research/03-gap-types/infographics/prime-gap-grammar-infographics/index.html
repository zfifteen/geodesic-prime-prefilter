<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>14-State Prime Gap Grammar Infographics</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #03050b;
      --panel: #070b16;
      --text: #edf7ff;
      --muted: #a9c7d8;
      --gold: #ffe58a;
      --cyan: #44dfff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0%, #101932 0, var(--bg) 46rem);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: 1560px;
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      letter-spacing: 0;
    }

    p {
      width: 980px;
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.45;
    }

    figure {
      margin: 0 0 44px;
      padding: 22px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--cyan) 60%, transparent);
      border-radius: 10px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.35;
    }

    figcaption strong {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <main>
    <h1>14-State Prime Gap Grammar Infographics</h1>
    <p>
      Each plate uses an AI-generated sacred-geometry background and a deterministic
      annotation layer. The labels come from the frozen v1.0 grammar summary:
      a 14-state reduced alphabet with the three gold states forming the
      Semiprime Wheel Attractor.
    </p>

    <figure>
      <img src="assets/pgs-14-state-grammar-mandala-annotated.png" alt="Annotated 14-state prime gap grammar mandala">
      <figcaption>
        <strong>Core alphabet.</strong>
        <span>All 14 exact state labels are listed in side legends. The geometry uses short node IDs to keep the center readable.</span>
      </figcaption>
    </figure>

    <figure>
      <img src="assets/pgs-semiprime-wheel-attractor-laws-annotated.png" alt="Annotated Semiprime Wheel Attractor return laws">
      <figcaption>
        <strong>Return laws.</strong>
        <span>The gold triad carries the attractor. The bottom blocks show the measured return and retention shares.</span>
      </figcaption>
    </figure>

    <figure>
      <img src="assets/pgs-three-layer-grammar-engine-annotated.png" alt="Annotated three-layer prime gap grammar engine">
      <figcaption>
        <strong>Three-layer engine.</strong>
        <span>The same 14-state wheel is annotated as core grammar, lag-2 transition law, and higher-divisor event-lock controller.</span>
      </figcaption>
    </figure>
  </main>
</body>
</html>
