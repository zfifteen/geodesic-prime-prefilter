<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540">
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .ink { fill: #1f2528; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #586069; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h1 { font-size: 48px; font-weight: 800; }
      .h2 { font-size: 30px; font-weight: 800; }
      .body { font-size: 24px; }
      .small { font-size: 20px; }
      .tiny { font-size: 17px; }
      .math { font-size: 24px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #d7d2c8; stroke-width: 3; rx: 12; }
      .source { fill: #effaf5; stroke: #238866; stroke-width: 4; rx: 12; }
      .signal { fill: #fff4ef; stroke: #bd5b43; stroke-width: 4; rx: 12; }
      .lock { fill: #fdf9e8; stroke: #b68a1f; stroke-width: 4; rx: 12; }
      .audit { fill: #f0f4fb; stroke: #637aa3; stroke-width: 4; rx: 12; }
      .prime { fill: #e8f1ff; stroke: #3b6fb6; stroke-width: 3; rx: 8; }
      .comp { fill: #fff0f0; stroke: #c45c5c; stroke-width: 3; rx: 8; }
      .inner { fill: #ffffff; stroke: #d7d2c8; stroke-width: 2; rx: 10; }
      .arrow-hot { stroke: #bd5b43; stroke-width: 6; fill: none; marker-end: url(#arrowHot); }
      .arrow-gold { stroke: #b68a1f; stroke-width: 6; fill: none; marker-end: url(#arrowGold); }
    </style>
    <marker id="arrowHot" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#bd5b43"/>
    </marker>
    <marker id="arrowGold" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
      <path d="M0,0 L14,5 L0,10 Z" fill="#b68a1f"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1540"/>

  <!-- Header -->
  <text class="ink h1" x="72" y="70">Twin-Prime Resonance (GWR Super-Signal)</text>
  <text class="muted body" x="72" y="112">Four remainder zeros at the GWR carrier force a twin gap.</text>

  <!-- Step 1 -->
  <rect class="box" x="72" y="140" width="1456" height="220"/>
  <text class="ink h2" x="108" y="186">1. Read the gap interior</text>
  <text class="muted small" x="108" y="222">Consecutive primes p and q. Composites sit between them.</text>
  <text class="muted small" x="108" y="252">GWR picks the leftmost lowest divisor-count point w.</text>

  <rect class="prime" x="140" y="280" width="84" height="58"/>
  <rect class="comp" x="244" y="280" width="84" height="58"/>
  <rect class="comp" x="348" y="280" width="84" height="58"/>
  <rect class="comp" x="452" y="280" width="84" height="58"/>
  <rect class="prime" x="556" y="280" width="84" height="58"/>
  <text class="ink math" x="168" y="318">p</text>
  <text class="ink math" x="272" y="318">…</text>
  <text class="ink math" x="376" y="318">w</text>
  <text class="ink math" x="480" y="318">…</text>
  <text class="ink math" x="584" y="318">q</text>
  <text class="muted tiny" x="680" y="318">GWR witness w = leftmost min τ(n) in (p, q)</text>

  <!-- Step 2 -->
  <rect class="source" x="72" y="390" width="1456" height="250"/>
  <text class="ink h2" x="108" y="436">2. Measure remainder zeros</text>
  <text class="muted small" x="108" y="472">Vector R(w) on M_v1 = (2, 3, 5, 7, 30, 210, 2310)</text>

  <rect class="inner" x="108" y="500" width="1384" height="118"/>
  <text class="ink math" x="128" y="538">R(w) = (0, 0, 0, r7, 0, 0, 0)</text>
  <text class="ink math" x="128" y="572">→ at least 4 remainder zeros</text>
  <text class="muted tiny" x="128" y="604">Lemma 1: count_zeros(R(w)) ≥ 4  ⟺  w ≡ 0 (mod 30)</text>

  <path class="arrow-hot" d="M800 650 L800 690"/>

  <!-- Step 3 -->
  <rect class="signal" x="72" y="700" width="1456" height="250"/>
  <text class="ink h2" x="108" y="746">3. Super-Signal fires</text>
  <text class="muted small" x="108" y="782">A multiple of 30 has τ(w) ≥ 8.</text>
  <text class="muted small" x="108" y="812">Larger gaps always contain an earlier lower-τ competitor.</text>
  <text class="ink math" x="108" y="856">So w ≡ 0 (mod 30) can win GWR only when |I| = 1</text>
  <text class="muted tiny" x="108" y="892">Interior competitor lemmas exclude g ≥ 3</text>

  <path class="arrow-hot" d="M800 960 L800 1000"/>

  <!-- Step 4 + 5 -->
  <rect class="lock" x="72" y="1010" width="860" height="210"/>
  <text class="ink h2" x="108" y="1056">4. Twin lock</text>
  <text class="ink math" x="108" y="1100">g = q − p = 2</text>
  <text class="ink math" x="108" y="1140">p = w − 1 ,   q = w + 1</text>
  <text class="muted small" x="108" y="1180">The next integer after the carrier is the terminating prime.</text>

  <path class="arrow-gold" d="M932 1115 H992"/>
  <rect class="audit" x="1000" y="1010" width="528" height="210"/>
  <text class="ink h2" x="1036" y="1056">5. Audit</text>
  <text class="muted small" x="1036" y="1096">1.5×10⁶ lane: 3,842 / 3,842 twin</text>
  <text class="muted small" x="1036" y="1132">2×10⁶ scan: 0 counterexamples</text>
  <text class="muted small" x="1036" y="1168">Status: proved · corollary of GWR</text>

  <!-- Theorem strip -->
  <rect class="box" x="72" y="1250" width="1456" height="230"/>
  <text class="ink h2" x="108" y="1296">Theorem (Twin-Prime Resonance)</text>
  <text class="ink body" x="108" y="1340">If the GWR witness has ≥ 4 remainder zeros on M_v1,</text>
  <text class="ink body" x="108" y="1374">then the gap is twin and q = w + 1.</text>
  <text class="muted tiny" x="108" y="1412">PGS-native rule: divisor field → GWR → remainder vector → exact gap termination</text>
  <text class="muted tiny" x="108" y="1444">Four zeros force w ≡ 0 (mod 30); only twin gaps can host that witness.</text>
</svg>