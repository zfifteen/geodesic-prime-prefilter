<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The weight is the first divisor above the gap</title>
  <desc id="desc">Example with p equals 67, q equals 71, gap equals 4, and p minus gap equals 63. The first divisor above 4 is 7.</desc>
  <rect width="1600" height="900" fill="#fbfbf7"/>
  <rect x="70" y="60" width="1460" height="780" rx="28" fill="#ffffff" stroke="#1d2939" stroke-width="4"/>
  <text x="115" y="145" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#1d2939">2/4  The weight is the first divisor above the gap</text>

  <rect x="140" y="215" width="390" height="150" rx="22" fill="#e7f0ff" stroke="#2563eb" stroke-width="4"/>
  <text x="335" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1d2939">prime p = 67</text>
  <text x="335" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#475467">next prime q = 71</text>

  <rect x="605" y="215" width="390" height="150" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
  <text x="800" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1d2939">gap g = 4</text>
  <text x="800" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#475467">71 minus 67</text>

  <rect x="1070" y="215" width="390" height="150" rx="22" fill="#ecfdf3" stroke="#22c55e" stroke-width="4"/>
  <text x="1265" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1d2939">p - g = 63</text>
  <text x="1265" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#475467">the field being measured</text>

  <text x="800" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1d2939">Divisors of 63</text>
  <line x1="230" y1="585" x2="1370" y2="585" stroke="#98a2b3" stroke-width="5"/>
  <line x1="547" y1="535" x2="547" y2="635" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
  <text x="547" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#9a3412">gap floor: 4</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle">
    <circle cx="300" cy="585" r="44" fill="#f2f4f7" stroke="#98a2b3" stroke-width="3"/>
    <text x="300" y="599" fill="#667085">1</text>
    <circle cx="460" cy="585" r="44" fill="#f2f4f7" stroke="#98a2b3" stroke-width="3"/>
    <text x="460" y="599" fill="#667085">3</text>
    <circle cx="650" cy="585" r="54" fill="#dcfce7" stroke="#16a34a" stroke-width="6"/>
    <text x="650" y="600" fill="#166534">7</text>
    <circle cx="830" cy="585" r="44" fill="#ffffff" stroke="#98a2b3" stroke-width="3"/>
    <text x="830" y="599" fill="#344054">9</text>
    <circle cx="1010" cy="585" r="50" fill="#ffffff" stroke="#98a2b3" stroke-width="3"/>
    <text x="1010" y="599" fill="#344054">21</text>
    <circle cx="1220" cy="585" r="50" fill="#ffffff" stroke="#98a2b3" stroke-width="3"/>
    <text x="1220" y="599" fill="#344054">63</text>
  </g>

  <rect x="320" y="705" width="960" height="86" rx="20" fill="#ecfdf3" stroke="#22c55e" stroke-width="4"/>
  <text x="800" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#166534">The first divisor above 4 is 7, so the weight is 7.</text>
</svg>
