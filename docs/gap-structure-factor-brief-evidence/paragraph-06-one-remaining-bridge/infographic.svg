<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">One remaining bridge</title>
  <desc id="desc">Two equal load values pin the right side, leaving one unresolved bridge to the lower-left factor lane event.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a3412"/></marker></defs>
  <rect width="920" height="360" fill="#fbfcfd"/>
  <rect x="34" y="34" width="852" height="292" rx="8" fill="#fff" stroke="#d7dde3"/>
  <text x="460" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1f2933">The open proof has one remaining bridge</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="185" y="135" width="170" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="270" y="168" font-size="14" font-weight="700" fill="#1d4ed8">public selected load</text><text x="270" y="202" font-size="30" font-weight="700" fill="#1d4ed8">4</text>
    <rect x="565" y="135" width="170" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="650" y="168" font-size="14" font-weight="700" fill="#1d4ed8">endpoint right load</text><text x="650" y="202" font-size="30" font-weight="700" fill="#1d4ed8">4</text>
    <line x1="370" y1="178" x2="550" y2="178" stroke="#0f766e" stroke-width="4"/>
    <text x="460" y="161" font-size="13" font-weight="700" fill="#0f766e">load equality</text>
    <rect x="386" y="252" width="148" height="45" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="460" y="280" font-size="13" font-weight="700" fill="#9a3412">remaining proof bridge</text>
  </g>
  <path d="M602 222 C560 250, 525 262, 500 268" fill="none" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M318 222 C360 250, 395 262, 420 268" fill="none" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
