<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Status separation gates</title>
  <desc id="desc">Three gates separate public structure, factor endpoint recovery, and downstream audit confirmation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect width="920" height="360" fill="#fbfcfd"/>
  <rect x="34" y="34" width="852" height="292" rx="8" fill="#fff" stroke="#d7dde3"/>
  <text x="460" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1f2933">Structure, factor, and audit are separate</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="90" y="145" width="190" height="92" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="185" y="180" font-size="15" font-weight="700" fill="#1d4ed8">public structure</text><text x="185" y="206" font-size="12" fill="#334155">meaningful evidence</text>
    <rect x="365" y="145" width="190" height="92" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="460" y="180" font-size="15" font-weight="700" fill="#9a3412">factor endpoint</text><text x="460" y="206" font-size="12" fill="#334155">required for resolved</text>
    <rect x="640" y="145" width="190" height="92" rx="8" fill="#ecfdf5" stroke="#99f6e4"/>
    <text x="735" y="180" font-size="15" font-weight="700" fill="#0f766e">audit confirms</text><text x="735" y="206" font-size="12" fill="#334155">separate check</text>
  </g>
  <path d="M285 191H355" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 191H630" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="460" y="285" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#5e6a73">Endpoint structure alone is not a factor result.</text>
</svg>

