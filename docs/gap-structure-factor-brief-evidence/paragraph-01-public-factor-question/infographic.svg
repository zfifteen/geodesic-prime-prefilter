<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Public product and hidden factor endpoints</title>
  <desc id="desc">A visible product sits in the center of an ordered public neighborhood, with hidden factor endpoints on both sides and a question arrow from the public marks toward one endpoint.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="920" height="360" rx="0" fill="#fbfcfd"/>
  <rect x="34" y="34" width="852" height="292" rx="8" fill="#ffffff" stroke="#d7dde3"/>

  <text x="460" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#1f2933">One visible product, two hidden endpoints</text>
  <text x="460" y="101" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#5e6a73">The research question is whether public order around N forces a path back to a factor.</text>

  <line x1="130" y1="190" x2="790" y2="190" stroke="#94a3b8" stroke-width="3"/>
  <line x1="130" y1="176" x2="130" y2="204" stroke="#334155" stroke-width="3"/>
  <line x1="790" y1="176" x2="790" y2="204" stroke="#334155" stroke-width="3"/>

  <g fill="#64748b" stroke="#64748b" stroke-width="2">
    <line x1="210" y1="181" x2="210" y2="199"/>
    <line x1="270" y1="181" x2="270" y2="199"/>
    <line x1="330" y1="181" x2="330" y2="199"/>
    <line x1="390" y1="181" x2="390" y2="199"/>
    <line x1="530" y1="181" x2="530" y2="199"/>
    <line x1="590" y1="181" x2="590" y2="199"/>
    <line x1="650" y1="181" x2="650" y2="199"/>
    <line x1="710" y1="181" x2="710" y2="199"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="393" y="146" width="134" height="88" rx="8" fill="#0f766e"/>
    <text x="460" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">public product</text>
    <text x="460" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#ffffff">N</text>
  </g>

  <g>
    <circle cx="130" cy="190" r="34" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="130" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">hidden</text>
    <text x="130" y="203" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">factor</text>
  </g>

  <g>
    <circle cx="790" cy="190" r="34" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <text x="790" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">hidden</text>
    <text x="790" y="203" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">factor</text>
  </g>

  <path d="M 430 252 C 330 286, 230 284, 166 213" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="292" y="307" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Can public order force a factor endpoint?</text>

  <rect x="246" y="126" width="168" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="330" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">visible ordered marks</text>

  <rect x="506" y="126" width="168" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="590" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">visible ordered marks</text>

  <text x="460" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#5e6a73">If the structure does not force an endpoint, the correct status is unresolved.</text>
</svg>
