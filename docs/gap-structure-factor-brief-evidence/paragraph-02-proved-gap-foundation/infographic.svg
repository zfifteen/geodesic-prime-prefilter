<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Prime gap divisor-count foundation</title>
  <desc id="desc">A known prime p and next prime q bound a gap. Interior composites carry divisor counts, and the first lowest load is highlighted.</desc>
  <rect width="920" height="360" fill="#fbfcfd"/>
  <rect x="34" y="34" width="852" height="292" rx="8" fill="#ffffff" stroke="#d7dde3"/>
  <text x="460" y="75" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1f2933">Exact divisor counts locate the gap</text>
  <text x="460" y="102" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#5e6a73">The first later count of two is the next prime; the first lowest interior load is selected.</text>
  <line x1="120" y1="190" x2="800" y2="190" stroke="#94a3b8" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <circle cx="120" cy="190" r="32" fill="#0f766e"/><text x="120" y="196" font-size="20" font-weight="700" fill="#fff">p</text>
    <circle cx="800" cy="190" r="32" fill="#0f766e"/><text x="800" y="196" font-size="20" font-weight="700" fill="#fff">q</text>
    <g fill="#f8fafc" stroke="#64748b">
      <circle cx="220" cy="190" r="25"/><circle cx="320" cy="190" r="25"/><circle cx="420" cy="190" r="25"/><circle cx="520" cy="190" r="25"/><circle cx="620" cy="190" r="25"/>
    </g>
    <circle cx="320" cy="190" r="31" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <g fill="#334155" font-size="13" font-weight="700">
      <text x="220" y="195">6</text><text x="320" y="195">4</text><text x="420" y="195">8</text><text x="520" y="195">4</text><text x="620" y="195">12</text>
    </g>
    <text x="320" y="254" font-size="13" font-weight="700" fill="#1d4ed8">first lowest interior load</text>
    <text x="120" y="244" font-size="12" fill="#5e6a73">known prime</text>
    <text x="800" y="244" font-size="12" fill="#5e6a73">first later count of 2</text>
  </g>
</svg>

