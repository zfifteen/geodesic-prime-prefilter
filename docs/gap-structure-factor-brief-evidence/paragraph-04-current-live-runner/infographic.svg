<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Current live runner rows</title>
  <desc id="desc">A three-row ladder showing public inference and downstream audit status for 40-bit, 50-bit, and 64-bit cases.</desc>
  <rect width="920" height="360" fill="#fbfcfd"/>
  <rect x="34" y="34" width="852" height="292" rx="8" fill="#fff" stroke="#d7dde3"/>
  <text x="460" y="74" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1f2933">Three committed rows, two separate checks</text>
  <text x="260" y="122" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#334155">public inference</text>
  <text x="660" y="122" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#334155">downstream audit</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">
    <rect x="96" y="145" width="728" height="44" rx="6" fill="#ecfdf5" stroke="#99f6e4"/>
    <text x="132" y="172" font-weight="700" fill="#0f766e">40-bit</text><text x="260" y="172" text-anchor="middle" fill="#1f2933">endpoint closure</text><text x="660" y="172" text-anchor="middle" fill="#0f766e" font-weight="700">factor found</text>
    <rect x="96" y="201" width="728" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="132" y="228" font-weight="700" fill="#9a3412">50-bit</text><text x="260" y="228" text-anchor="middle" fill="#1f2933">carrier mismatch</text><text x="660" y="228" text-anchor="middle" fill="#9a3412" font-weight="700">unresolved</text>
    <rect x="96" y="257" width="728" height="44" rx="6" fill="#ecfdf5" stroke="#99f6e4"/>
    <text x="132" y="284" font-weight="700" fill="#0f766e">64-bit</text><text x="260" y="284" text-anchor="middle" fill="#1f2933">mutual closure</text><text x="660" y="284" text-anchor="middle" fill="#0f766e" font-weight="700">factor found</text>
  </g>
</svg>

